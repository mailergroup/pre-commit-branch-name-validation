[project]
name = "pre-commit-branch-validation"
version = "1.0.0"
description = "A pre-commit hook that validates branch names."
readme = "README.md"
requires-python = ">=3.8.1"
keywords = ["git", "pre-commit", "branch-names", "git-hooks"]
authors = [
    {name = "Igor Hrček", email = "igor@mailerlite.com"}
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.25.0",
    "pre-commit>=2.12.1",
    "setuptools>=67.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.8.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pre-commit-branch-validation = "pre_commit_branch_validation.hook:main"

[project.urls]
code = "https://github.com/mailergroup/pre-commit-branch-validation"
tracker = "https://github.com/mailergroup/pre-commit-branch-validation/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "*.egg-info",
    ".git",
    ".pytest_cache",
    ".vscode",
]
