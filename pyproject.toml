[project]
name = "pre-commit-branch-validation"
version = "1.0.0"
description = "A pre-commit hook that validates branch names."
readme = "README.md"
requires-python = ">=3.8.1"
keywords = ["git", "pre-commit", "branch-names", "git-hooks"]
authors = [
    {name = "Igor Hrček", email = "igor@mailerlite.com"}
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.25.0",
    "pre-commit>=2.12.1",
    "setuptools>=67.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pre-commit-branch-validation = "pre_commit_branch_validation.hook:main"

[project.urls]
code = "https://github.com/mailergroup/pre-commit-branch-validation"
tracker = "https://github.com/mailergroup/pre-commit-branch-validation/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 127
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "*.egg-info",
    ".git",
    ".pytest_cache",
    ".vscode",
]
